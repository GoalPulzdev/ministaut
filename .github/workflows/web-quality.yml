name: Web quality
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-quality.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-quality.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci && npm run check && npm test
        working-directory: web
